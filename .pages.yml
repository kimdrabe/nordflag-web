media:
  input: public
  output: /public

content:
  - name: leistungen
    label: Leistungen
    type: collection
    path: src/content/leistungen
    format: yaml-frontmatter
    view:
      primary: title
      sort: order
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: description
        label: Kurzbeschreibung
        type: text
        required: true
      - name: icon
        label: Icon
        type: string
        required: true
      - name: order
        label: Reihenfolge
        type: number
        required: true
      - name: body
        label: Inhalt
        type: rich-text

  - name: referenzen
    label: Referenzen
    type: collection
    path: src/content/referenzen
    format: yaml-frontmatter
    view:
      primary: title
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: description
        label: Beschreibung
        type: text
        required: true
      - name: category
        label: Kategorie
        type: string
        required: true
      - name: url
        label: Website-URL
        type: string
      - name: body
        label: Inhalt
        type: rich-text

  - name: testimonials
    label: Kundenbewertungen
    type: collection
    path: src/content/testimonials
    format: yaml-frontmatter
    view:
      primary: name
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Position / Unternehmen
        type: string
        required: true
      - name: rating
        label: Bewertung (1-5)
        type: number
        required: true
      - name: body
        label: Bewertungstext
        type: text

  - name: team
    label: Team
    type: collection
    path: src/content/team
    format: yaml-frontmatter
    view:
      primary: name
      sort: order
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Position
        type: string
        required: true
      - name: order
        label: Reihenfolge
        type: number
        required: true
      - name: body
        label: Beschreibung
        type: text

  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    view:
      primary: title
      sort: pubDate
      order: desc
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: description
        label: Beschreibung
        type: text
        required: true
      - name: pubDate
        label: Veröffentlichungsdatum
        type: date
        required: true
      - name: author
        label: Autor
        type: string
        required: true
      - name: category
        label: Kategorie
        type: string
        required: true
      - name: body
        label: Inhalt
        type: rich-text
